<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgur Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #123021; color: #fff; padding: 20px 40px; text-align: center; }

        header { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: 3px; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; opacity: 0.7; }
        nav a.active { opacity: 1; font-style: italic; }

        h1 { letter-spacing: 4px; margin-bottom: 20px; font-size: 22px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1d422f;
            border-radius: 12px;
            padding: 10px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }

        .carousel-dots {
    display: flex;
    height: 10px;
    padding-left: 2px;
    justify-content:center ;
}
.dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background-color: #3b5247;
    cursor: pointer;
}
    </style>
</head>
<body>
    <header>
        <div class="logo">BURGUR</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="#" class="active">Menu</a>
            <a href="#">About</a>
            <a href="#">Shop</a>
        </nav>
    </header>

    <h1>MENU</h1>

    <div class="grid">
        <div class="card"><img src="image1.png">New In the Club</div>
        <div class="card"><img src="img.png">Burger</div>
        <div class="card"><img src="image2.png">Sides</div>
        <div class="card"><img src="imagefries.png">Fries</div>
        <div class="card"><img src="image4.png">Deserts & Drinks</div>
        <div class="card"><img src="image5.png">Launch Offer @99</div>
        <div class="card"><img src="image6.png">Wraps</div>
        <div class="card"><img src="image7.png">Salads</div>
    </div>

   <div class="carousel-dots">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>
</body>
</html>
